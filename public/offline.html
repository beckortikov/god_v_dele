<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1c24" media="(prefers-color-scheme: dark)">
  <title>Нет подключения — Год в деле</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <style>
    :root {
      --background: oklch(0.982 0.004 265);
      --foreground: oklch(0.22 0.02 265);
      --card: oklch(1 0 0);
      --muted-foreground: oklch(0.5 0.02 265);
      --border: oklch(0.915 0.007 265);
      --primary: oklch(0.52 0.2 268);
      --primary-foreground: oklch(0.99 0 0);
      --primary-soft: oklch(0.95 0.03 268);
      --primary-soft-foreground: oklch(0.42 0.17 268);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: oklch(0.165 0.012 265);
        --foreground: oklch(0.94 0.006 265);
        --card: oklch(0.2 0.013 265);
        --muted-foreground: oklch(0.7 0.015 265);
        --border: oklch(0.28 0.013 265);
        --primary: oklch(0.7 0.15 268);
        --primary-foreground: oklch(0.17 0.02 265);
        --primary-soft: oklch(0.3 0.06 268);
        --primary-soft-foreground: oklch(0.85 0.08 268);
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--background);
      color: var(--foreground);
      font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 420px;
      padding: 40px 24px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      margin-bottom: 16px;
      border-radius: 12px;
      background: var(--primary-soft);
      color: var(--primary-soft-foreground);
    }
    h1 { margin: 0; font-size: 18px; font-weight: 600; }
    p { margin: 6px 0 0; color: var(--muted-foreground); }
    button {
      margin-top: 24px;
      height: 36px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: var(--primary-foreground);
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 150ms;
    }
    button:hover { opacity: 0.9; }
    button:focus-visible { outline: 3px solid color-mix(in oklch, var(--primary) 35%, transparent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.43"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/></svg>
    </span>
    <h1>Нет подключения к интернету</h1>
    <p>Финансовые данные показываются только онлайн, чтобы вы не работали со старыми цифрами. Проверьте сеть и обновите страницу.</p>
    <button type="button" onclick="location.reload()">Обновить страницу</button>
  </main>
  <script>
    window.addEventListener('online', function () { location.reload() })
  </script>
</body>
</html>
